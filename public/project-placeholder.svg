<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111317"/>
      <stop offset="0.5" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(880 260) rotate(120) scale(520 420)">
      <stop stop-color="#F8F4EC" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F8F4EC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 700) rotate(-35) scale(520 420)">
      <stop stop-color="#F8F4EC" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F8F4EC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(255,255,255,0.10)"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)" opacity="0.6"/>
  <circle cx="880" cy="260" r="520" fill="url(#glow1)"/>
  <circle cx="320" cy="700" r="520" fill="url(#glow2)"/>

  <rect x="90" y="90" width="1020" height="720" rx="44" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  <rect x="130" y="132" width="320" height="14" rx="7" fill="rgba(248,244,236,0.70)"/>
  <rect x="130" y="168" width="520" height="10" rx="5" fill="rgba(201,196,184,0.42)"/>

  <g opacity="0.75">
    <rect x="130" y="235" width="470" height="250" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
    <rect x="630" y="235" width="450" height="120" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
    <rect x="630" y="375" width="450" height="110" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
    <rect x="130" y="515" width="950" height="220" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
  </g>

  <text x="130" y="790" fill="rgba(248,244,236,0.72)" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="0.5">

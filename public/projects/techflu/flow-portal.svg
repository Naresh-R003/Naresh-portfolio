<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: rgba(248,244,236,0.92); }
      .muted { fill: rgba(248,244,236,0.62); }
      .box { fill: rgba(17,19,23,0.75); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .line { stroke: rgba(255,255,255,0.22); stroke-width: 2.5; }
      .pill { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <text x="60" y="90" class="t" font-size="40" font-weight="700">Techflu • Customer Portal Flow</text>
  <text x="60" y="130" class="t muted" font-size="20">Discovery → Checkout → KYC → Tracking (SSR-backed catalog + OTP-first funnel)</text>

  <g transform="translate(60,190)">
    <rect class="box" x="0" y="0" width="1080" height="380" rx="16"/>

    <g transform="translate(48,70)">
      <rect class="pill" x="0" y="0" width="240" height="64" rx="999"/>
      <text x="120" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Product Listing</text>
      <text x="120" y="86" text-anchor="middle" class="t muted" font-size="14">SSR / SEO catalog</text>
    </g>

    <line class="line" x1="330" y1="102" x2="438" y2="102"/>

    <g transform="translate(450,70)">
      <rect class="pill" x="0" y="0" width="240" height="64" rx="999"/>
      <text x="120" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">OTP Login</text>
      <text x="120" y="86" text-anchor="middle" class="t muted" font-size="14">Leads-first capture</text>
    </g>

    <line class="line" x1="720" y1="102" x2="828" y2="102"/>

    <g transform="translate(840,70)">
      <rect class="pill" x="0" y="0" width="240" height="64" rx="999"/>
      <text x="120" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Checkout</text>
      <text x="120" y="86" text-anchor="middle" class="t muted" font-size="14">Order placement</text>
    </g>

    <g transform="translate(150,210)">
      <rect class="pill" x="0" y="0" width="300" height="64" rx="999"/>
      <text x="150" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Payments</text>
      <text x="150" y="86" text-anchor="middle" class="t muted" font-size="14">PhonePe / Razorpay</text>
    </g>

    <line class="line" x1="468" y1="242" x2="576" y2="242"/>

    <g transform="translate(588,210)">
      <rect class="pill" x="0" y="0" width="300" height="64" rx="999"/>
      <text x="150" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">KYC</text>
      <text x="150" y="86" text-anchor="middle" class="t muted" font-size="14">Digio verification</text>
    </g>

    <g transform="translate(360,318)">
      <rect class="pill" x="0" y="0" width="360" height="64" rx="999"/>
      <text x="180" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Tracking Dashboard</text>
      <text x="180" y="86" text-anchor="middle" class="t muted" font-size="14">Dispatch → Delivery states</text>
    </g>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: rgba(248,244,236,0.92); }
      .muted { fill: rgba(248,244,236,0.62); }
      .box { fill: rgba(17,19,23,0.75); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .line { stroke: rgba(255,255,255,0.22); stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <text x="60" y="90" class="t" font-size="40" font-weight="700">Techflu • Delivery Partner Mobile Web</text>
  <text x="60" y="130" class="t muted" font-size="20">Accept job → Verify device → Track → Proof of delivery</text>

  <g transform="translate(60,190)">
    <rect class="box" x="0" y="0" width="1080" height="380" rx="16"/>

    <g transform="translate(70,150)">
      <rect class="pill" x="0" y="0" width="240" height="64" rx="999"/>
      <text x="120" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Login</text>
      <text x="120" y="86" text-anchor="middle" class="t muted" font-size="14">Credentials + role</text>
    </g>

    <line class="line" x1="330" y1="182" x2="438" y2="182"/>

    <g transform="translate(450,150)">
      <rect class="pill" x="0" y="0" width="240" height="64" rx="999"/>
      <text x="120" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Accept Delivery</text>
      <text x="120" y="86" text-anchor="middle" class="t muted" font-size="14">Task assignment</text>
    </g>

    <line class="line" x1="720" y1="182" x2="828" y2="182"/>

    <g transform="translate(840,150)">
      <rect class="pill" x="0" y="0" width="240" height="64" rx="999"/>
      <text x="120" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Verification</text>
      <text x="120" y="86" text-anchor="middle" class="t muted" font-size="14">Serial + condition</text>
    </g>

    <g transform="translate(310,260)">
      <rect class="pill" x="0" y="0" width="460" height="64" rx="999"/>
      <text x="230" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Live Location Tracking</text>
      <text x="230" y="86" text-anchor="middle" class="t muted" font-size="14">Status updates to admin + user</text>
    </g>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="40%" r="70%">
      <stop offset="0" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: rgba(248,244,236,0.92); }
      .muted { fill: rgba(248,244,236,0.62); }
      .box { fill: rgba(17,19,23,0.75); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .node { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .line { stroke: rgba(255,255,255,0.22); stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <text x="60" y="90" class="t" font-size="40" font-weight="700">Techflu • Admin Command Center</text>
  <text x="60" y="130" class="t muted" font-size="20">Inventory • KYC approvals • Order orchestration • Dispatch visibility</text>

  <g transform="translate(60,190)">
    <rect class="box" x="0" y="0" width="1080" height="380" rx="16"/>

    <g transform="translate(90,80)">
      <rect class="node" x="0" y="0" width="320" height="80" rx="14"/>
      <text x="24" y="36" class="t" font-size="18" font-weight="700">Real-time Inventory</text>
      <text x="24" y="62" class="t muted" font-size="14">SKU status • city availability • holds</text>
    </g>

    <g transform="translate(670,80)">
      <rect class="node" x="0" y="0" width="320" height="80" rx="14"/>
      <text x="24" y="36" class="t" font-size="18" font-weight="700">KYC Review</text>
      <text x="24" y="62" class="t muted" font-size="14">Digio verification • approvals • flags</text>
    </g>

    <line class="line" x1="410" y1="120" x2="670" y2="120"/>

    <g transform="translate(90,220)">
      <rect class="node" x="0" y="0" width="420" height="110" rx="14"/>
      <text x="24" y="42" class="t" font-size="18" font-weight="700">Order Management</text>
      <text x="24" y="68" class="t muted" font-size="14">cancellations • refunds • SLA tracking</text>
      <text x="24" y="94" class="t muted" font-size="14">operations view for dispatch → delivery</text>
    </g>

    <g transform="translate(620,235)">
      <rect class="node" x="0" y="0" width="370" height="110" rx="14"/>
      <text x="24" y="42" class="t" font-size="18" font-weight="700">Delivery Partner Ops</text>
      <text x="24" y="68" class="t muted" font-size="14">create • assign • route visibility</text>
      <text x="24" y="94" class="t muted" font-size="14">live status + proof-of-delivery</text>
    </g>

    <line class="line" x1="510" y1="275" x2="620" y2="290"/>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: rgba(248,244,236,0.92); }
      .muted { fill: rgba(248,244,236,0.62); }
      .box { fill: rgba(17,19,23,0.75); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .node { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .line { stroke: rgba(255,255,255,0.22); stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <text x="60" y="90" class="t" font-size="40" font-weight="700">Lighthouse • Geospatial Distance Engine</text>
  <text x="60" y="130" class="t muted" font-size="20">Distance Matrix + Geolocation for landmark proximity</text>

  <g transform="translate(60,190)">
    <rect class="box" x="0" y="0" width="1080" height="380" rx="16"/>

    <g transform="translate(90,120)">
      <rect class="node" x="0" y="0" width="320" height="140" rx="14"/>
      <text x="24" y="44" class="t" font-size="18" font-weight="700">Property Coordinates</text>
      <text x="24" y="76" class="t muted" font-size="14">lat/lng from listing</text>
      <text x="24" y="106" class="t muted" font-size="14">user location (optional)</text>
    </g>

    <line class="line" x1="430" y1="190" x2="560" y2="190"/>

    <g transform="translate(570,120)">
      <rect class="node" x="0" y="0" width="420" height="140" rx="14"/>
      <text x="24" y="44" class="t" font-size="18" font-weight="700">Distance Matrix API</text>
      <text x="24" y="76" class="t muted" font-size="14">schools • hospitals • transit</text>
      <text x="24" y="106" class="t muted" font-size="14">computed proximity insights</text>
    </g>

    <g transform="translate(90,290)">
      <rect class="node" x="0" y="0" width="900" height="70" rx="14"/>
      <text x="24" y="44" class="t" font-size="18" font-weight="700">Outcome</text>
      <text x="190" y="44" class="t muted" font-size="14">Faster research with live proximity data on each property</text>
    </g>
  </g>
</svg>


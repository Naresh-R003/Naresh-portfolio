<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="40%" r="70%">
      <stop offset="0" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: rgba(248,244,236,0.92); }
      .muted { fill: rgba(248,244,236,0.62); }
      .box { fill: rgba(17,19,23,0.75); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .node { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .line { stroke: rgba(255,255,255,0.22); stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <text x="60" y="90" class="t" font-size="40" font-weight="700">Lighthouse • CMS + Backend Architecture</text>
  <text x="60" y="130" class="t muted" font-size="20">Strapi schema • lead automation • CronJob audits</text>

  <g transform="translate(60,190)">
    <rect class="box" x="0" y="0" width="1080" height="380" rx="16"/>

    <g transform="translate(90,90)">
      <rect class="node" x="0" y="0" width="360" height="110" rx="14"/>
      <text x="24" y="42" class="t" font-size="18" font-weight="700">Strapi Collection Types</text>
      <text x="24" y="72" class="t muted" font-size="14">Holiday • Residential • Commercial</text>
      <text x="24" y="96" class="t muted" font-size="14">International • Exclusive • more</text>
    </g>

    <g transform="translate(630,90)">
      <rect class="node" x="0" y="0" width="360" height="110" rx="14"/>
      <text x="24" y="42" class="t" font-size="18" font-weight="700">Lead Automation</text>
      <text x="24" y="72" class="t muted" font-size="14">EmailJS routing</text>
      <text x="24" y="96" class="t muted" font-size="14">Zepto Mail notifications</text>
    </g>

    <line class="line" x1="450" y1="145" x2="630" y2="145"/>

    <g transform="translate(90,240)">
      <rect class="node" x="0" y="0" width="900" height="110" rx="14"/>
      <text x="24" y="42" class="t" font-size="18" font-weight="700">Automated Data Freshness (CronJobs)</text>
      <text x="24" y="72" class="t muted" font-size="14">Audit listings • detect stale updates • trigger escalation emails</text>
      <text x="24" y="96" class="t muted" font-size="14">Keeps luxury inventory accurate for high-intent users</text>
    </g>
  </g>
</svg>


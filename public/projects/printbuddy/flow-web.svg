<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="40%" r="70%">
      <stop offset="0" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: rgba(248,244,236,0.92); }
      .muted { fill: rgba(248,244,236,0.62); }
      .box { fill: rgba(17,19,23,0.75); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .line { stroke: rgba(255,255,255,0.22); stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <text x="60" y="90" class="t" font-size="40" font-weight="700">Print Buddy • Web Platform</text>
  <text x="60" y="130" class="t muted" font-size="20">Onboarding → Dashboard → Franchise operations</text>

  <g transform="translate(60,190)">
    <rect class="box" x="0" y="0" width="1080" height="380" rx="16"/>

    <g transform="translate(70,150)">
      <rect class="pill" x="0" y="0" width="260" height="64" rx="999"/>
      <text x="130" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">User Onboarding</text>
      <text x="130" y="86" text-anchor="middle" class="t muted" font-size="14">Profile + verification</text>
    </g>

    <line class="line" x1="360" y1="182" x2="468" y2="182"/>

    <g transform="translate(480,150)">
      <rect class="pill" x="0" y="0" width="260" height="64" rx="999"/>
      <text x="130" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Dashboard</text>
      <text x="130" y="86" text-anchor="middle" class="t muted" font-size="14">Orders + status</text>
    </g>

    <line class="line" x1="770" y1="182" x2="878" y2="182"/>

    <g transform="translate(890,150)">
      <rect class="pill" x="0" y="0" width="260" height="64" rx="999"/>
      <text x="130" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Franchise Ops</text>
      <text x="130" y="86" text-anchor="middle" class="t muted" font-size="14">Manage workflows</text>
    </g>
  </g>
</svg>


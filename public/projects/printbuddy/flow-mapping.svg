<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: rgba(248,244,236,0.92); }
      .muted { fill: rgba(248,244,236,0.62); }
      .box { fill: rgba(17,19,23,0.75); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .node { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .line { stroke: rgba(255,255,255,0.22); stroke-width: 2.5; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <text x="60" y="90" class="t" font-size="40" font-weight="700">Print Buddy • JSON → PDF Mapping</text>
  <text x="60" y="130" class="t muted" font-size="20">Validated UI inputs mapped to print-ready schema</text>

  <g transform="translate(60,190)">
    <rect class="box" x="0" y="0" width="1080" height="380" rx="16"/>

    <g transform="translate(90,90)">
      <rect class="node" x="0" y="0" width="360" height="260" rx="14"/>
      <text x="24" y="48" class="t" font-size="18" font-weight="700">UI Inputs</text>
      <text x="24" y="86" class="t muted mono" font-size="14">{ name, address, idNo, ... }</text>
      <text x="24" y="126" class="t muted" font-size="14">Validation + sanitization</text>
      <text x="24" y="156" class="t muted" font-size="14">Field-level constraints</text>
      <text x="24" y="186" class="t muted" font-size="14">Consistent formatting</text>
    </g>

    <line class="line" x1="470" y1="220" x2="610" y2="220"/>

    <g transform="translate(620,90)">
      <rect class="node" x="0" y="0" width="370" height="260" rx="14"/>
      <text x="24" y="48" class="t" font-size="18" font-weight="700">Mapping Schema</text>
      <text x="24" y="86" class="t muted mono" font-size="14">JSON → PDF template</text>
      <text x="24" y="126" class="t muted" font-size="14">Strict keys + types</text>
      <text x="24" y="156" class="t muted" font-size="14">No “ghost” values</text>
      <text x="24" y="186" class="t muted" font-size="14">Print-safe layout</text>
    </g>
  </g>
</svg>


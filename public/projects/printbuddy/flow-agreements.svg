<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: rgba(248,244,236,0.92); }
      .muted { fill: rgba(248,244,236,0.62); }
      .box { fill: rgba(17,19,23,0.75); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .pill { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.16); stroke-width: 2; }
      .line { stroke: rgba(255,255,255,0.22); stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <text x="60" y="90" class="t" font-size="40" font-weight="700">Print Buddy • Agreement Flow Engine</text>
  <text x="60" y="130" class="t muted" font-size="20">Input → Verification → e-Sign → Document generation</text>

  <g transform="translate(60,190)">
    <rect class="box" x="0" y="0" width="1080" height="380" rx="16"/>

    <g transform="translate(70,150)">
      <rect class="pill" x="0" y="0" width="250" height="64" rx="999"/>
      <text x="125" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Form Inputs</text>
      <text x="125" y="86" text-anchor="middle" class="t muted" font-size="14">Validated fields</text>
    </g>

    <line class="line" x1="350" y1="182" x2="458" y2="182"/>

    <g transform="translate(470,150)">
      <rect class="pill" x="0" y="0" width="250" height="64" rx="999"/>
      <text x="125" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">Digio Verify</text>
      <text x="125" y="86" text-anchor="middle" class="t muted" font-size="14">Aadhaar + checks</text>
    </g>

    <line class="line" x1="750" y1="182" x2="858" y2="182"/>

    <g transform="translate(870,150)">
      <rect class="pill" x="0" y="0" width="250" height="64" rx="999"/>
      <text x="125" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">e-Sign</text>
      <text x="125" y="86" text-anchor="middle" class="t muted" font-size="14">Signed & verified</text>
    </g>

    <g transform="translate(360,260)">
      <rect class="pill" x="0" y="0" width="420" height="64" rx="999"/>
      <text x="210" y="41" text-anchor="middle" class="t" font-size="18" font-weight="700">PDF Generation</text>
      <text x="210" y="86" text-anchor="middle" class="t muted" font-size="14">Print-ready output</text>
    </g>
  </g>
</svg>

